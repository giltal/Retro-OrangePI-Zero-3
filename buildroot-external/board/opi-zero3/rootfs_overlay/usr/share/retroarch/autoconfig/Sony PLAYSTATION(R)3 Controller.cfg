# DualShock 3 over Bluetooth (BlueZ/uhid presents it under this name).
#
# Button indices are NOT arbitrary: RetroArch's udev joypad driver numbers
# buttons in ascending evdev key-code order, so these were derived from the
# pad's own capability list rather than copied:
#   304 BTN_SOUTH=0  305 EAST=1  307 NORTH=2  308 WEST=3  310 TL=4  311 TR=5
#   312 TL2=6  313 TR2=7  314 SELECT=8  315 START=9  316 MODE=10
#   317 THUMBL=11  318 THUMBR=12  544..547 DPAD U/D/L/R = 13/14/15/16
# Axes likewise: ABS_X=0 ABS_Y=1 ABS_Z=2 ABS_RX=3 ABS_RY=4 ABS_RZ=5.
#
# Without a matching autoconfig RetroArch logs
#   [Autoconf]: PS3 Controller (1356/616) not configured.
# and the pad does nothing in-game, while still working in the launcher --
# which reads evdev directly with its own bindings.

input_driver = "udev"
input_device = "Sony PLAYSTATION(R)3 Controller"
input_vendor_id = "1356"
input_product_id = "616"

input_b_btn = "0"
input_a_btn = "1"
input_x_btn = "2"
input_y_btn = "3"
input_l_btn = "4"
input_r_btn = "5"
input_l2_btn = "6"
input_r2_btn = "7"
input_select_btn = "8"
input_start_btn = "9"
# menu toggle is a HOTKEY, defined in retroarch.cfg as
# input_enable_hotkey_btn=10 + input_menu_toggle_btn=2.
# Binding it here as a plain button would shadow the modifier.
input_l3_btn = "11"
input_r3_btn = "12"
input_up_btn = "13"
input_down_btn = "14"
input_left_btn = "15"
input_right_btn = "16"

input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"
input_r_x_plus_axis = "+3"
input_r_x_minus_axis = "-3"
input_r_y_plus_axis = "+4"
input_r_y_minus_axis = "-4"
