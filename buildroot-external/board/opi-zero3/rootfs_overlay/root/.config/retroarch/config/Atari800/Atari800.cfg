# Per-core override for the Atari 800 core.
#
# POKEY output from this core is quieter than the other cores here, reported
# from hardware as "sound works but it is weak even at 100%". Nothing is wrong
# with the audio path -- the same path is loud on fceumm, gambatte and the rest.
#
# audio_volume is a gain in dB applied by RetroArch before the samples reach
# ALSA (DEFAULT_AUDIO_VOLUME is 0.0). Boosting it here lifts this core only and
# leaves the ALSA master -- which the launcher owns -- alone.
#
# MEASURED 2026-08-26, replacing the earlier +9 dB which was explicitly a guess.
# Metered at the point RetroArch converts to s16 (where clamping happens), at
# unity gain, 70 s per title -- an ATR needs about a minute to boot before it
# makes any sound at all, and a 25 s window measures nothing but loading:
#
#   ARKANOID.ATR    native peak  5186  (15% of full scale)
#   Asteroids.atr   native peak  8908  (27%)
#   AIRWOLF.ATR     native peak 11738  (35%)   <- loudest of the three
#
# That is a 7 dB spread between titles, which is why "Atari is quiet" is a fair
# description of some games and not others. Applying gain to the loudest:
#
#   +7 dB  -> AIRWOLF at 80% FS
#   +8 dB  -> AIRWOLF at 89% FS      <- shipped
#   +9 dB  -> AIRWOLF at 100% FS, CLIPPING   <- what was here before
#  +12 dB  -> Asteroids and AIRWOLF both clip hard
#
# So the previous +9 dB was not merely a guess, it was slightly over: loud
# titles were being clamped. 8.0 dB is the largest value that keeps the loudest
# measured title under the clamp with a little margin for a title louder than
# any of these.
#
# IF IT IS STILL TOO QUIET, the remaining loudness is analog, not digital.
# Digital gain is hard-capped here by clipping. The headphone control was at
# 47 of 63 when measured, i.e. ~16 dB of analog range still unused, and that is
# what the launcher's volume dial and the in-game hotkeys (PS + UP / PS + DOWN)
# actually move. Raising this number further will distort before it gets louder.
audio_volume = "8.000000"
