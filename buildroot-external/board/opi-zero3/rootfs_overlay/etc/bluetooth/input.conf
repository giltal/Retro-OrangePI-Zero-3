# BlueZ input profile configuration for RetroOPI_Z3 (carried over from RetroBPI_M2M).

[General]
# The DualShock 3 never bonds. Its pairing is done over USB by the sixaxis
# plugin, which writes the host's address into the pad; the pad then connects
# with no link key and no PIN, and "Paired: no" is the correct end state.
#
# BlueZ defaults ClassicBondedOnly=true (added for CVE-2023-45866), which
# refuses to connect the HID profile unless the device is bonded. Against a DS3
# that produces an endless loop of:
#     bonding_attempt_complete() ... status 0x5   (PIN or Link Key Missing)
# with the ACL link up, the device Trusted and Connected, and no js0 ever
# appearing.
#
# SECURITY TRADE-OFF, stated plainly: setting this false re-opens
# CVE-2023-45866 -- an attacker within Bluetooth range can connect as an
# unauthenticated HID device and inject keystrokes/input. On a games console
# that is mostly a nuisance rather than a route to data, and it is the only way
# to support a DS3, but it is a real weakening and should not be carried into a
# product that does anything more sensitive.
ClassicBondedOnly=false
