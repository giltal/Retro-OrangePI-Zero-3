# BlueZ configuration for RetroOPI_Z3 (carried over from RetroBPI_M2M).
#
# Only what must differ from BlueZ's built-in defaults is listed; anything
# absent falls back to those defaults, so this stays small and readable rather
# than being a copy of the upstream file that drifts out of date.

[General]
# The DualShock 3 is a Bluetooth 2.0+EDR HID device, not BLE. Keep the
# controller in dual mode so BR/EDR is available.
ControllerMode = dual

# Identify as an input host. Some pads decide what to offer based on class.
Class = 0x000100

[Policy]
# Power the adapter on automatically at boot and re-enable it after a reset.
# Without this the adapter comes up rfkill'd/down and nothing can connect on a
# headless device, where there is no one to run "bluetoothctl power on".
AutoEnable = true

# Reconnect input devices without being asked. A game controller should just
# work when it is switched on, not wait for an agent to approve it.
ReconnectAttempts = 7
ReconnectIntervals = 1,2,4,8,16,32,64
