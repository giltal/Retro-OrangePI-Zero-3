# Boots the LZ4-compressed kernel (made by post-build.sh): U-Boot reads ~20 MB
# instead of 44.7 MB and unpacks it in memory, which is faster on an SD card.
# If that label fails, U-Boot tries the next one (pxe_utils'
# boot_unattempted_labels), the uncompressed Image: same everything else.
# post-build.sh checks that the two append lines stay identical.
label RetroOPI-Z3
    kernel /boot/Image.lz4
    fdt /boot/sun50i-h618-orangepi-zero3.dtb
    # console=ttyS0 is KEPT, as on the reference: the serial console on the
    # 3-pin debug header has been the only way into a board more than once.
    #
    # quiet loglevel=4: only warnings and errors reach the consoles during
    # boot; `dmesg` still has the full log afterwards. Bring-up ran verbose
    # (loglevel=7) on purpose -- the first boot of build #1, with "quiet
    # loglevel=4", gave a black HDMI and no network, which says nothing -- and
    # the boot-time pass made it quiet: at 115200 baud every printk line costs
    # real milliseconds, and fbcon scrolled every line on the TV. To debug a
    # boot that hangs, put loglevel=7 back (both labels).
    #
    # root=/dev/mmcblk0p1: the SD slot is the only MMC host the Zero3 DT
    # enables (mmc1 is the UWE5622 Wi-Fi, disabled until its driver is in), so
    # it is always mmcblk0. The reference board had an SD/SDIO numbering race;
    # if Wi-Fi is ever enabled here, add mmc aliases to the DT before trusting this.
    #
    # cma=256M: scanout buffers must be physically contiguous, so they come
    # from CMA, and arm64 defconfig reserves only 32 MiB. At 1080p one XRGB
    # buffer is 8 MiB: fbcon holds one, the launcher double-buffers, and
    # RetroArch/Mesa wants ~3 more. Games then died with
    #   DRM_IOCTL_MODE_CREATE_DUMB failed: Cannot allocate memory
    #   MESA: error: Failed to create scanout resource
    # (at 720p everything is 2.25x smaller and it fitted by luck). 256 MiB is
    # 12% of the 2 GB, and the kernel reuses unused CMA for movable pages.
    append earlycon console=tty1 console=ttyS0,115200 root=/dev/mmcblk0p1 rootwait panic=10 quiet loglevel=4 cma=256M ${extra}

# Fallback: the uncompressed kernel, tried only if the label above fails to
# boot (no "default" line: U-Boot boots the labels in file order).
# retroopi.boot=uncompressed only marks it in /proc/cmdline, so a boot that
# fell back is visible (unknown key=value arguments go to init's environment).
label RetroOPI-Z3-uncompressed
    kernel /boot/Image
    fdt /boot/sun50i-h618-orangepi-zero3.dtb
    append earlycon console=tty1 console=ttyS0,115200 root=/dev/mmcblk0p1 rootwait panic=10 quiet loglevel=4 cma=256M ${extra} retroopi.boot=uncompressed

# An explicit fdt rather than "fdtdir /boot": one DTB, no guessing about which
# $fdtfile U-Boot resolves. Buildroot installs it flat in /boot because
# BR2_LINUX_KERNEL_DTB_KEEP_DIRNAME is not set.
