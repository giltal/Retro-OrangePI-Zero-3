label RetroOPI-Z3
    kernel /boot/Image
    fdt /boot/sun50i-h618-orangepi-zero3.dtb
    # console=ttyS0 is KEPT, as on the reference: the serial console on the
    # 3-pin debug header has been the only way into a board more than once.
    #
    # "quiet loglevel=4" suppresses the per-driver printk flood. At 115200 baud
    # every line costs real milliseconds -- the cheapest boot-time win there is.
    #
    # root=/dev/mmcblk0p1: the SD slot is the only MMC host the Zero3 DT
    # enables (mmc1 is the UWE5622 Wi-Fi, disabled until its driver is in), so
    # it is always mmcblk0. The reference board had an SD/SDIO numbering race;
    # if Wi-Fi is ever enabled here, add mmc aliases to the DT before trusting this.
    append console=ttyS0,115200 root=/dev/mmcblk0p1 rootwait panic=10 quiet loglevel=4 ${extra}

# An explicit fdt rather than "fdtdir /boot": one DTB, no guessing about which
# $fdtfile U-Boot resolves. Buildroot installs it flat in /boot because
# BR2_LINUX_KERNEL_DTB_KEEP_DIRNAME is not set.
